<div class="rendez-vous-container">
  <aside class="sidebar">
    <h2>Voir mes rendez-vous passés</h2>
  </aside>

  <main class="content">
    <div class="empty-state">
      <div class="calendar-icon">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <rect x="20" y="30" width="80" height="70" fill="#2196F3" rx="8"/>
          <rect x="20" y="30" width="80" height="20" fill="#1565C0" rx="8"/>
          <rect x="35" y="55" width="15" height="15" fill="#FFF" rx="3"/>
          <rect x="53" y="55" width="15" height="15" fill="#FFF" rx="3"/>
          <rect x="71" y="55" width="15" height="15" fill="#FFD54F" rx="3"/>
        </svg>
      </div>

      <h1>Aucun rendez-vous à venir</h1>
      <p>Prenez votre santé en main. Réservez facilement votre prochain rendez-vous sur Doctolib.</p>

      <button class="btn-primary" (click)="prendreRendezVous()">
        PRENDRE RENDEZ-VOUS
      </button>
    </div>
  </main>
</div>
