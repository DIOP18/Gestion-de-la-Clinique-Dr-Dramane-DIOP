<div class="auth-container">
  <nav class="auth-navbar">
    <div class="nav-content">
      <div class="logo" (click)="navigateToHome()">
        <h1>Clinique Dr DRAMANE DIOP</h1>
      </div>
      <div class="nav-links">
        <a routerLink="/auth/login" class="btn-outline">Se connecter</a>
      </div>
    </div>
  </nav>

  <div class="auth-content">
    <div class="auth-card">
      <div class="card-header">
        <button class="back-btn" (click)="navigateToHome()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Étape précédente
        </button>
      </div>

      <div class="card-body">
        <div class="brand-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1565c0" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </div>

        <h2 class="card-title">Créer un compte</h2>
        <p class="card-subtitle">Rejoignez Clinique Dr DRAMANE DIOP</p>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <div *ngIf="errorMessage" class="alert alert-error">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ errorMessage }}
          </div>

          <!-- Photo de profil -->
          <div class="form-group">
            <label>Photo de profil *</label>
            <div class="image-upload">
              <div class="image-preview" [class.has-image]="imagePreview">
                <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview">
                <div *ngIf="!imagePreview" class="placeholder">
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                  </svg>
                  <span>Ajouter une photo</span>
                </div>
                <input type="file" accept="image/*" (change)="onFileSelected($event)">
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="first_name">Prénom *</label>
              <input
                id="first_name"
                type="text"
                formControlName="first_name"
                class="form-control"
                placeholder="Jean"
              />
            </div>

            <div class="form-group">
              <label for="last_name">Nom *</label>
              <input
                id="last_name"
                type="text"
                formControlName="last_name"
                class="form-control"
                placeholder="Dupont"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              class="form-control"
              placeholder="votre@email.com"
            />
          </div>

          <div class="form-group">
            <label for="password">Mot de passe *</label>
            <div class="password-input">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                class="form-control"
                placeholder="Au moins 8 caractères"
              />
              <button type="button" class="toggle-password" (click)="togglePassword()">
                <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="phone">Téléphone *</label>
            <input
              id="phone"
              type="tel"
              formControlName="phone"
              class="form-control"
              placeholder="+221 77 123 45 67"
            />
          </div>

          <div class="form-group">
            <label for="address">Adresse *</label>
            <input
              id="address"
              type="text"
              formControlName="address"
              class="form-control"
              placeholder="Votre adresse complète"
            />
          </div>

          <div class="form-group">
            <label for="gender">Genre *</label>
            <select id="gender" formControlName="gender" class="form-control">
              <option value="">Sélectionner</option>
              <option value="M">Masculin</option>
              <option value="F">Féminin</option>
            </select>
          </div>

          <button type="submit" class="btn-submit" [disabled]="loading">
            <span *ngIf="!loading">S'inscrire</span>
            <span *ngIf="loading" class="loading-spinner">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
              </svg>
              Inscription...
            </span>
          </button>
        </form>

        <div class="divider">
          <span>Vous avez déjà un compte ?</span>
        </div>

        <button type="button" class="btn-secondary" routerLink="/auth/login">
          Se connecter
        </button>

        <p class="terms">
          En créant un compte, vous acceptez nos
          <a href="#">Conditions d'utilisation</a> et notre
          <a href="#">Politique de confidentialité</a>
        </p>
      </div>
    </div>
  </div>
</div>
